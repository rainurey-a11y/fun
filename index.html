<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assinment help </title>
    <meta name="description" content="Click to view the shared resources for the semester project.">
    
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #fce4ec 0%, #ffc1cc 50%, #f8bbd0 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
            transition: background 1s ease;
        }

        #container {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 40px;
            border: 2px solid white;
            box-shadow: 0 20px 40px rgba(255, 105, 180, 0.3);
            max-width: 450px;
            z-index: 10;
        }

        img {
            width: 250px;
            border-radius: 25px;
            margin-bottom: 25px;
        }

        h1 {
            color: #d81b60;
            font-size: 28px;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        button {
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-pink {
            background: linear-gradient(45deg, #ff4d6d, #ff758c);
            color: white;
            animation: pulse 1.5s infinite;
        }

        .btn-gray { background-color: #f0f0f0; color: #888; }

        .heart {
            position: fixed;
            top: -10vh;
            animation: fall linear forwards;
            z-index: 5;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="phase1">
            <img src="minion-minion-loves.gif" alt="Minion Love">
            <h1>Will you be my Valentine? 🥺</h1>
            <div class="buttons">
                <button id="yesBtn" class="btn-pink" onclick="nextPhase()">Yes! ❤️</button>
                <button id="noBtn" class="btn-gray" onmouseover="moveButton('noBtn')">No</button>
            </div>
        </div>

        <div id="phase2" style="display:none;">
            <img src="tenor_1.gif" alt="Happy Minions">
            <h1>How should our story begin? 🌙✨<br>
                <small style="font-size: 16px; color: #ad1457;">Pick a plan for the night: 🌃</small>
            </h1>
            <div class="buttons">
                <button class="btn-pink" onclick="sendWhatsApp('Dinner 🥂✨')">Dinner 🥂✨</button>
                <button class="btn-pink" onclick="sendWhatsApp('a Night Drive 🚗💨')">Night Drive 🚗💨</button>
                <button id="changeMindBtn" class="btn-gray" onmouseover="moveButton('changeMindBtn')">Change Mind 🌙</button>
            </div>
        </div>
    </div>

    <script>
        let yesSize = 18;

        function moveButton(id) {
            const btn = document.getElementById(id);
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';

            if(id === 'noBtn') {
                yesSize += 8;
                const yesBtn = document.getElementById('yesBtn');
                yesBtn.style.fontSize = yesSize + 'px';
                yesBtn.style.padding = (yesSize * 0.7) + 'px ' + (yesSize * 1.6) + 'px';
            }
        }

        function nextPhase() {
            document.getElementById('phase1').style.display = 'none';
            document.getElementById('phase2').style.display = 'block';
            document.body.style.background = "linear-gradient(135deg, #2c3e50 0%, #000000 100%)";
            document.getElementById('container').style.background = "rgba(255, 255, 255, 0.9)";
            setInterval(createHeart, 150);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            const nightGlow = ['❤️', '🌙', '✨', '⭐', '💖', '🌃'];
            heart.innerHTML = nightGlow[Math.floor(Math.random() * nightGlow.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
            heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 3000);
        }

       function sendWhatsApp(choice) {
    const phoneNumber = "9779845116480"; 
    const text = "The assignment is complete! I've decided on " + choice + ". 🌙✨";
    const message = encodeURIComponent(text);
    const whatsappUrl = `https://wa.me/${phoneNumber}?text=${message}`;
    window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
