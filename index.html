<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I have a question...</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffeef2;
            font-family: 'Arial', sans-serif;
            text-align: center;
            overflow: hidden;
        }
        #container {
            background: white;
            padding: 2.5rem;
            border-radius: 30px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            max-width: 400px;
            z-index: 10;
        }
        img {
            width: 250px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        h1 {
            color: #d63384;
            font-size: 28px;
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        button {
            padding: 12px 28px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #yesBtn {
            background-color: #ff4d6d;
            color: white;
        }
        #noBtn {
            background-color: #adb5bd;
            color: white;
        }
        /* Heart Animation Styles */
        .heart {
            position: fixed;
            top: -10vh;
            transform: translateY(0);
            animation: fall 3s linear forwards;
            color: #ff4d6d;
            font-size: 2rem;
            z-index: 5;
        }
        @keyframes fall {
            to {
                transform: translateY(110vh);
            }
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div id="container">
        <img id="displayGif" src="minion-minion-loves.gif" alt="Minion Love">
        <h1 id="questionText">Will you be my Valentine?</h1>
        <div class="buttons" id="btnGroup">
            <button id="yesBtn" onclick="celebrate()">Yes!</button>
            <button id="noBtn" onmouseover="moveButton()">No</button>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const questionText = document.getElementById('questionText');

        let yesSize = 18;

        function moveButton() {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';

            yesSize += 10;
            yesBtn.style.fontSize = yesSize + 'px';
            yesBtn.style.padding = (yesSize * 0.6) + 'px ' + (yesSize * 1.5) + 'px';
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(heart);
            
            setTimeout(() => { heart.remove(); }, 5000);
        }

        function celebrate() {
            questionText.innerText = "YAY! Can't wait! ❤️";
            document.getElementById('btnGroup').classList.add('hidden');
            
            // Start the heart shower!
            setInterval(createHeart, 150);
        }
    </script>
</body>
</html>
